# Explanation and localisation settings (scripts/explain.py, scripts/eval_xai.py). Fixed before any XAI run.
threshold: 0.15            # binarise each map at 15% of its max (Selvaraju et al. 2017, Grad-CAM §4.1)
sweep: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
boundary_half_width: 5     # lesion-border band, px each side at 224 px
centre_sigma: 0.25         # centre-Gaussian reference map: std = 0.25 * image size
figures_per_class: 2       # figure strips per class, the same images for every run
figure_seed: 0
batch_size: 16
