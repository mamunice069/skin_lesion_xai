[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skin_lesion_xai"
version = "0.1.0"
description = "Explainable hybrid EfficientNetV2 + Swin Transformer for skin lesion classification (CSE 6231)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
